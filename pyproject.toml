[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs real NATS (NATS_URL) and/or Postgres (DATABASE_URL)",
  "e2e: needs the full docker compose stack running",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["builds", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["mycelium_sdk", "supervisor", "app", "tracer", "memory", "gateway", "main", "telegram_bridge", "new_module"]
