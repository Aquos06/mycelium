# Laya: the local decision model (https://huggingface.co/convaiinnovations/laya, Apache 2.0) behind its
# own server, laya-serve. Jev-compatible POST /v1/systemone: a state plus typed questions in, an answer
# with a probability per option out, one forward pass, no text generation.
#
#   docker compose up -d --build                                          CPU (LAYA_DEVICE=cpu in .env)
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build   with the NVIDIA GPU
#   python3 smoke.py http://localhost:8100
#
# Auth: laya-serve requires a bearer token as soon as LAYA_API_KEY exists in its environment, even
# empty. So the key is not listed here; it reaches the container only through .env (env_file), and
# only when you set it there. Leave the line out of .env for an open server on the LAN.

name: mycelium-infra

services:
  laya:
    build: .
    image: mycelium/laya:0.4.14
    env_file:
      - path: .env
        required: false
    environment:
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: "8000"                           # inside the container; the host port is LAYA_PORT in .env
      LAYA_DEVICE: ${LAYA_DEVICE:-cuda}          # cuda | cpu
      LAYA_PRELOAD: ${LAYA_PRELOAD:-1}           # load the checkpoints at start, not on the first request
      HF_HOME: /models
    ports:
      - "${LAYA_PORT:-8100}:8000"
    volumes:
      - laya-models:/models                       # the checkpoints (~0.8 GB each) survive rebuilds
    healthcheck:
      # one real decision; sends the bearer when LAYA_API_KEY is set
      test:
        - CMD
        - python
        - -c
        - |
          import json, os, urllib.request
          body = {"state": {"document": "ok"}, "questions": {"q": {"type": "noul", "instructions": "Is this text non-empty?"}}}
          headers = {"Content-Type": "application/json"}
          if os.environ.get("LAYA_API_KEY"):
              headers["Authorization"] = "Bearer " + os.environ["LAYA_API_KEY"]
          req = urllib.request.Request("http://localhost:8000/v1/systemone", data=json.dumps(body).encode(), headers=headers)
          assert urllib.request.urlopen(req, timeout=20).status == 200
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 300s                          # first start downloads the checkpoints
    restart: unless-stopped

volumes:
  laya-models:
