# The tool-calling benchmark for Main (scripts/bench_tools.py): a message, the context Main would have had, and
# what Main should do with it. `expect` is one of Main's tools (services/main/tools) or `none` (answer without
# a tool). The case passes when the expected tool is called during the turn (`none`: no tool at all); `args`
# checks the first valid call of that tool: a string or list means the value is one of them, `has:` means its
# text contains one of them (case-insensitive). Names in `pack` and `modules` refer to `notes` and `modules`
# below, built from the fixture vault (tests/fixtures/vault) plus a few people it does not have. A new tool gets
# its 20 cases here before it ships, and the suite runs before and after, so the old classes show a regression.
#
#   set -a; source .env; set +a
#   .venv/bin/python scripts/bench_tools.py --cases tests/fixtures/bench/tools.yaml                  # the planner slot
#   .venv/bin/python scripts/bench_tools.py --cases ... --provider vllm --provider claude            # compare
#
# Nothing touches the stack: memory and the modules are stubs that answer from this file, only the planner
# calls reach a model.

today: 2026-11-03          # a Tuesday; "yesterday" is 2026-11-02
tz: Asia/Taipei

modules:
  hello:
    purpose: Counts chat messages per day so the system has a first working module to deploy and query.
    requests: [stats]
    subscribes: [sense.chat]
    reply: {today: 14, days: {"2026-11-02": 31, "2026-11-01": 9}, total: 412}
  expenses:
    purpose: >-
      Tracks spending from chat (an amount and a short description, TWD unless said otherwise) and answers
      totals for a date range with the top descriptions.
    requests: [summary]
    subscribes: [sense.chat]
    reply:
      from: "2026-10-27"
      to: "2026-11-02"
      total: 3420
      currency: TWD
      top: [{description: dinner, amount: 1240}, {description: coffee, amount: 510}, {description: grab, amount: 380}]
  climbing:
    purpose: Logs climbing sessions from chat (the day, the gym, the hardest grade sent) and lists them.
    requests: [sessions]
    subscribes: [sense.chat]
    reply:
      count: 3
      sessions:
        - {day: "2026-10-25", gym: Passion Climbing Xinyi, hardest: V4}
        - {day: "2026-10-29", gym: Passion Climbing Xinyi, hardest: V5}
        - {day: "2026-11-01", gym: B-Plus, hardest: V4}
  ledger:  # the shape a grown tracker has now: described requests, entries through `add`, no chat parsing
    purpose: Tracks Hansen's spending, one entry per expense, and answers totals and the list of them.
    grown: true  # change_module can change it
    requests:
      add:
        description: Store one expense.
        params: {amount: number, description: string, day: optional date}
        returns: {id: number}
      summary:
        description: Totals and count for a date range, all time when no dates are given.
        params: {from: optional date, to: optional date}
        returns: {total: number, count: number}
      history:
        description: Every expense, newest first.
        params: {limit: optional number}
        returns: {expenses: list}
    reply: {id: 7, total: 3420, count: 21}
  books:  # a second grown module, for changes that are not about money
    purpose: Keeps the books Hansen reads, one entry per book, and lists them.
    grown: true
    version: 0.2.0
    requests:
      add:
        description: Store one book Hansen read.
        params: {title: string, author: optional string, finished: optional date}
        returns: {id: number}
      list:
        description: Every book, newest first.
        params: {year: optional number}
        returns: {books: list}
    reply: {id: 3, books: [{title: Project Hail Mary, author: Andy Weir, finished: "2026-10-12"}]}
  spending:  # a grown tracker whose replies are worth looking at: entries, totals by category and by day
    purpose: Tracks Hansen's spending, one entry per expense, with totals by category and by day.
    grown: true
    requests:
      history:
        description: Every expense in a date range, newest first.
        params: {from: optional date, to: optional date}
        returns: {expenses: list}
      summary:
        description: Totals for a date range, by category and by day.
        params: {from: optional date, to: optional date}
        returns: {total: number, count: number, by_category: map, by_day: list}
    reply:
      total: 3420
      count: 6
      by_category: {food: 1820, coffee: 740, transport: 520, other: 340}
      by_day:
        - {day: "2026-10-28", total: 320}
        - {day: "2026-10-29", total: 610}
        - {day: "2026-10-30", total: 240}
        - {day: "2026-10-31", total: 980}
        - {day: "2026-11-01", total: 450}
        - {day: "2026-11-02", total: 820}
      expenses:
        - {day: "2026-11-02", amount: 350, category: food, description: dinner}
        - {day: "2026-11-02", amount: 470, category: food, description: groceries}
        - {day: "2026-11-01", amount: 85, category: coffee, description: latte}
        - {day: "2026-10-31", amount: 520, category: transport, description: taxi}
        - {day: "2026-10-31", amount: 460, category: food, description: hotpot}
        - {day: "2026-10-30", amount: 240, category: other, description: haircut}
  water:
    purpose: Logs the water Hansen drinks, in ml, against his daily goal, and answers today and the last days.
    grown: true
    requests:
      today:
        description: Today's water so far and the daily goal.
        returns: {ml: number, goal_ml: number}
      week:
        description: Water per day for the last seven days.
        returns: {by_day: list}
    reply:
      ml: 1500
      goal_ml: 2000
      by_day:
        - {day: "2026-10-28", ml: 1800}
        - {day: "2026-10-29", ml: 2100}
        - {day: "2026-10-30", ml: 1200}
        - {day: "2026-10-31", ml: 2000}
        - {day: "2026-11-01", ml: 900}
        - {day: "2026-11-02", ml: 1700}
        - {day: "2026-11-03", ml: 1500}
default_modules: [hello, expenses, climbing]

