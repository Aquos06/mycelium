cases:
  # ---- remember: a durable fact, or an explicit "remember" -------------------------------------------
  - id: rem-mei-birthday
    msg: mei's birthday is march 3, remember that
    expect: remember
    pack: [mei]
    args: {note: mei, fact: {has: [birthday, march]}}
  - id: rem-landlord
    msg: remember that my landlord is Mr. Chen and rent is due on the 5th
    expect: remember
    args: {fact: {has: [rent, chen, landlord]}}
  - id: rem-dinner-152
    msg: i just spend 152 for my dinner, pelase log that for my expense
    expect: remember
    modules: []
    pack: [expense-log]
    args: {fact: {has: ["152"]}}
  - id: rem-mei-moved
    msg: mei moved to tainan last week
    expect: remember
    pack: [mei]
    args: {note: mei, fact: {has: [tainan]}}
  - id: rem-allergy
    msg: btw I'm allergic to shrimp
    expect: remember
    pack: [hansen]
    args: {note: hansen, fact: {has: [shrimp]}}
  - id: rem-ramen-mondays
    msg: the ramen place in xinyi is closed on mondays now
    expect: remember
    pack: [ramen]
    args: {note: ramen-place-xinyi, fact: {has: [monday]}}
  - id: rem-jason-number
    msg: remember jason's new number is 0912-345-678
    expect: remember
    pack: [jason]
    args: {note: jason, fact: {has: ["0912"]}}
  - id: rem-lin-job
    msg: my sister lin got the job at the hospital in taichung!
    expect: remember
    pack: [lin]
    args: {note: lin, fact: {has: [job, taichung]}}
  - id: rem-zh-mei-moving
    msg: 記住小美下個月搬去台南
    expect: remember
    pack: [mei]
    args: {note: mei, fact: {has: [台南, tainan]}}
  - id: rem-climbing-days
    msg: I switched my climbing days to tuesdays and fridays
    expect: remember
    pack: [hansen]
    args: {fact: {has: [tuesday, friday]}}
  - id: rem-gpu-box
    msg: note that the GPU box is at 192.168.0.107
    expect: remember
    pack: [mycelium]
    args: {fact: {has: [192.168.0.107]}}
  - id: rem-dentist
    msg: my dentist is Dr. Wu at the clinic on Anhe road
    expect: remember
    args: {fact: {has: [anhe, wu, dentist]}}
  - id: rem-draft-land
    msg: mei says draft land has a new menu, we should go sometime
    expect: remember
    pack: [mei, draft-land]
    args: {fact: {has: [menu]}}
  - id: rem-book-finished
    msg: finished project hail mary last night, loved it
    expect: remember
    pack: [mei]
    args: {fact: {has: [hail mary]}}
  - id: rem-lunch-yesterday
    msg: yesterday I had lunch with jason at the ramen place
    expect: remember
    pack: [jason, ramen]
    args: {day: "2026-11-02", fact: {has: [lunch]}}
  - id: rem-gym-wifi
    msg: "remember: the wifi password at the climbing gym is crimp2026"
    expect: remember
    args: {fact: {has: [crimp2026]}}
  - id: rem-kevin-wedding-date
    msg: kevin's wedding is on january 18, at the grand hotel
    expect: remember
    pack: [kevin]
    args: {note: kevin, fact: {has: [january, grand hotel, "18"]}}
  - id: rem-rent-up
    msg: my rent goes up to 28000 from december
    expect: remember
    pack: [hansen]
    args: {fact: {has: ["28000", "28,000"]}}
  - id: rem-coffee-rule
    msg: I've decided no more coffee after 2pm, keep that in mind
    expect: remember
    pack: [hansen]
    args: {fact: {has: [coffee]}}
  - id: rem-tainan-trip
    msg: mei and I are driving to tainan on the 15th to help her move
    expect: remember
    pack: [mei]
    args: {fact: {has: [tainan]}}

  # ---- logging: remember what nothing tracks, offer a module for it once, never claim a save not made ------
  # Hansen's own thread (2026-11-04): Main replied "Got it all saved" and called nothing. The history is his,
  # with the calls Main really made; *-old-history is the same thread as it was kept before calls were.
  - id: rem-moto-history
    msg: &moto >-
      today i did not spend anything, but tomorrow i need to spend 12000 for the motorcycle. it brokedown last
      saturdya, i need to change the gas pump and the gas lid, and also plus 500 for the chain cleaning
    expect: remember
    modules: [hello]
    history: &moto-history
      - {role: user, day: 2026-10-26, text: "hello from the web e2e a5a4007a"}
      - role: assistant
        text: "Hello from the other side! This is message 14 of today (2026-10-26), and the grand total is 34 messages across all time."
        calls: [{name: ask_module, input: {module: hello, action: stats}, result: {ok: true, today: 14, total: 34}}]
      - {role: user, day: 2026-10-27, text: "my name is hansen"}
      - {role: assistant, text: "Nice to meet you, Hansen! How can I help you?"}
      - {role: user, day: 2026-10-27, text: "today i spend 112 for dinner and 25 for drinks"}
      - role: assistant
        text: "Got it. I've logged your spending for today: 112 for dinner and 25 for drinks."
        calls: [{name: remember, input: {note: hansen, fact: "spent 112 on dinner and 25 on drinks"}}]
      - {role: user, day: 2026-11-02, text: "i just spend 152 for my dinner, pelase log that for my expense"}
      - role: assistant
        text: "Logged: 152 for dinner today."
        calls: [{name: remember, input: {note: hansen, fact: "spent 152 on dinner"}}]
  - id: rem-moto-old-history
    msg: *moto
    expect: remember
    modules: [hello]
    history:
      - {role: user, day: 2026-10-26, text: "hello from the web e2e a5a4007a"}
      - {role: assistant, text: "Hello from the other side! This is message 14 of today (2026-10-26), and the grand total is 34 messages across all time."}
      - {role: user, day: 2026-10-27, text: "today i spend 112 for dinner and 25 for drinks"}
      - {role: assistant, text: "Got it. I've logged your spending for today: 112 for dinner and 25 for drinks."}
      - {role: user, day: 2026-11-02, text: "i just spend 152 for my dinner, pelase log that for my expense"}
      - {role: assistant, text: "Logged: 152 for dinner today."}
  - id: rem-moto-fresh
    msg: *moto
    expect: remember
    modules: [hello]
  - id: rem-moto-date
    msg: my motorcycle broke down last saturday, remember that
    expect: remember
    modules: [hello]
    history: *moto-history
    args: {day: "2026-10-31"}  # last Saturday from Tuesday 2026-11-03, not the 2026-10-26 an old reply mentions
  - id: rem-log-offer
    msg: spent 85 on breakfast
    expect: remember
    also: [propose_module]  # nothing tracks spending: remember it, then offer a module
    modules: [hello]
  - id: rem-log-offer-zh
    msg: 早餐花了85
    expect: remember
    also: [propose_module]
    modules: [hello]
  - id: rem-log-waiting
    msg: lunch was 120
    expect: remember
    avoid: [propose_module]  # one is already offered and waiting for Build it
    modules: [hello]
    proposals: [{name: expenses, purpose: "Tracks spending from chat and answers totals for a date range."}]
  - id: rem-log-declined
    msg: taxi home was 240
    expect: remember
    avoid: [propose_module]  # he chose Not now two days ago
    modules: [hello]
    proposals:
      - {name: expenses, purpose: "Tracks spending from chat and answers totals.", status: declined, day: 2026-11-01}

  # ---- recall: the message is about memory the pack does not have --------------------------------------
  - id: rec-jason
    msg: what do you know about jason?
    expect: recall
    args: {query: {has: [jason]}}
  - id: rec-last-saw-mei
    msg: when did I last see mei?
    expect: recall
    args: {query: {has: [mei]}}
  - id: rec-oct14-dinner
    msg: who was I having dinner with on october 14?
    expect: recall
    args: {query: {has: ["10-14", oct]}}
  - id: rec-mei-meets-jason
    msg: has mei ever met jason?
    expect: recall
    pack: [mei]
    args: {query: {has: [jason]}}
  - id: rec-last-weekend
    msg: what did I do last weekend?
    expect: recall
    args: {query: {has: ["2026-11-01", "2026-10-31", weekend, "2026-W44"]}}
  - id: rec-mei-book
    msg: what was the book mei recommended?
    expect: recall
    args: {query: {has: [mei, book]}}
  - id: rec-landlord
    msg: what did I tell you about my landlord?
    expect: recall
    args: {query: {has: [landlord]}}
  - id: rec-dentist
    msg: remind me what my dentist's name is
    expect: recall
    args: {query: {has: [dentist]}}
  - id: rec-mycelium-notes
    msg: what's in your notes about the mycelium project?
    expect: recall
    args: {query: {has: [mycelium]}}
  - id: rec-oct14-day
    msg: what happened on october 14?
    expect: recall
    args: {query: {has: ["10-14", oct]}}
  - id: rec-mei-wrong-pack
    msg: where is mei moving to again?
    expect: recall
    pack: [ramen]
    args: {query: {has: [mei]}}
  - id: rec-zh-mei
    msg: 小美最近怎麼樣？
    expect: recall
    args: {query: {has: [小美, mei]}}
  - id: rec-sister
    msg: what do you know about my sister?
    expect: recall
    args: {query: {has: [sister, lin]}}
  - id: rec-last-month
    msg: what happened last month?
    expect: recall
    args: {query: {has: ["2026-10", october, month]}}
  - id: rec-jason-lunch
    msg: what did jason and I eat at lunch last thursday?
    expect: recall
    pack: [ramen]
    args: {query: {has: [jason, "2026-10-30", thursday]}}
  - id: rec-kevin-work
    msg: where does kevin work again?
    expect: recall
    args: {query: {has: [kevin]}}
  - id: rec-ramen-name
    msg: what was the name of that ramen shop near anhe?
    expect: recall
    args: {query: {has: [ramen, anhe]}}
  - id: rec-this-week
    msg: summarize my week so far
    expect: recall
    args: {query: {has: [week, "2026-W45", "2026-11"]}}
  - id: rec-gpu-box
    msg: remind me what I told you about the GPU box
    expect: recall
    args: {query: {has: [gpu]}}
  - id: rec-draft-land
    msg: have I been to draft land before?
    expect: recall
    args: {query: {has: [draft]}}

  # ---- ask_module: exact data a deployed module holds -----------------------------------------------
  - id: mod-spend-week
    msg: how much did I spend this week?
    expect: ask_module
    args: {module: expenses, action: summary}
  - id: mod-food-october
    msg: how much did i spend on food in october
    expect: ask_module
    args: {module: expenses, action: summary}
  - id: mod-top-last-month
    msg: what were my top expenses last month?
    expect: ask_module
    args: {module: expenses, action: summary}
  - id: mod-since-nov1
    msg: total spending since nov 1?
    expect: ask_module
    args: {module: expenses, action: summary}
