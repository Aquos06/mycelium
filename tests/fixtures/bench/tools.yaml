# The tool-calling benchmark for Main (scripts/bench_tools.py): a message, the context Main would have had, and
# what Main should do with it. `expect` is one of Main's tools (services/main/tools) or `none` (answer without
# a tool). The case passes when the expected tool is called during the turn (`none`: no tool at all); `args`
# checks the first valid call of that tool: a string or list means the value is one of them, `has:` means its
# text contains one of them (case-insensitive). Names in `pack` and `modules` refer to `notes` and `modules`
# below, built from the fixture vault (tests/fixtures/vault) plus a few people it does not have. A new tool gets
# its 20 cases here before it ships, and the suite runs before and after, so the old classes show a regression.
#
#   set -a; source .env; set +a
#   .venv/bin/python scripts/bench_tools.py --cases tests/fixtures/bench/tools.yaml                  # the planner slot
#   .venv/bin/python scripts/bench_tools.py --cases ... --provider vllm --provider claude            # compare
#
# Nothing touches the stack: memory and the modules are stubs that answer from this file, only the planner
# calls reach a model.

today: 2026-11-03          # a Tuesday; "yesterday" is 2026-11-02
tz: Asia/Taipei

modules:
  hello:
    purpose: Counts chat messages per day so the system has a first working module to deploy and query.
    requests: [stats]
    subscribes: [sense.chat]
    reply: {today: 14, days: {"2026-11-02": 31, "2026-11-01": 9}, total: 412}
  expenses:
    purpose: >-
      Tracks spending from chat (an amount and a short description, TWD unless said otherwise) and answers
      totals for a date range with the top descriptions.
    requests: [summary]
    subscribes: [sense.chat]
    reply:
      from: "2026-10-27"
      to: "2026-11-02"
      total: 3420
      currency: TWD
      top: [{description: dinner, amount: 1240}, {description: coffee, amount: 510}, {description: grab, amount: 380}]
  climbing:
    purpose: Logs climbing sessions from chat (the day, the gym, the hardest grade sent) and lists them.
    requests: [sessions]
    subscribes: [sense.chat]
    reply:
      count: 3
      sessions:
        - {day: "2026-10-25", gym: Passion Climbing Xinyi, hardest: V4}
        - {day: "2026-10-29", gym: Passion Climbing Xinyi, hardest: V5}
        - {day: "2026-11-01", gym: B-Plus, hardest: V4}
default_modules: [hello, expenses, climbing]

notes:
  mei:
    note: people/mei.md
    why: Mei is an alias of mei
    excerpt: |-
      Friend from the climbing gym, lives in [[taipei]].
      - 2026-10-14 dinner at [[ramen-place-xinyi]], she's moving to Tainan in Dec
      - 2026-09-02 recommended the book "Project Hail Mary"
  lin:
