    why: scored 0.35 for the question
    excerpt: |-
      Colleague, sits next to Hansen.
      - 2026-10-21 getting married in January
  ramen:
    note: places/ramen-place-xinyi.md
    why: ramen is an alias of ramen-place-xinyi
    excerpt: |-
      Ramen shop near Xinyi Anhe station (Menya Xinyi); usual order is the shoyu.
      - 2026-10-14 dinner with [[mei]], 350 TWD
  draft-land:
    note: places/draft-land.md
    why: scored 0.33 for the question
    excerpt: |-
      Cocktail bar on Zhongxiao East Road, [[mei]] recommended it.
  hansen:
    note: hansen.md
    why: the message is about Hansen
    excerpt: |-
      Lives in [[taipei]], works on [[mycelium]], climbs twice a week.
      - 2026-09-20 started climbing on Wednesdays and Saturdays
  mycelium:
    note: projects/mycelium.md
    why: mycelium is a note
    excerpt: |-
      Hansen's personal assistant system: services on a NATS bus, modules grown from specs.
      - 2026-11-02 the builder grows a module from a spec
  expense-log:
    note: things/expense-log.md
    why: scored 0.48 for the question
    excerpt: |-
      - 2026-10-28 spent 112 on dinner and 25 on drinks

