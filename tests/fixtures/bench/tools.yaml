  - id: chg-fix-its  # Hansen's thread, 2026-11-05: every `add` failed, he asked to fix it, Main grew expenses-v2
    msg: pelase fix its
    expect: change_module
    avoid: [propose_module]
    modules: [hello, ledger]
    history:
      - {role: user, text: "log all of my past expneses"}
      - role: assistant
        text: "The expenses module is running, but there's a mismatch: it expects a `day` field but the database column is `date`. I couldn't log any of them."
        calls:
          - {name: ask_module, input: {module: ledger, action: add, args: {amount: 112, description: dinner, day: "2026-10-28"}}, result: {ok: false, error: "table expenses has no column named day"}}
          - {name: ask_module, input: {module: ledger, action: add, args: {amount: 25, description: drinks, day: "2026-10-28"}}, result: {ok: false, error: "table expenses has no column named day"}}
    args: {module: ledger, change: {has: [day, date, column]}}
  - id: chg-remove-entry  # the same thread: the module has no way to take an entry out
    msg: wait remove the november 2 one, I logged it twice
    expect: change_module
    modules: [hello, ledger]
    history:
      - {role: user, text: "log 152 dinner on nov 2"}
      - role: assistant
        text: "Logged 152 for dinner on 2026-11-02."
        calls: [{name: ask_module, input: {module: ledger, action: add, args: {amount: 152, description: dinner, day: "2026-11-02"}}, result: {ok: true, id: 7}}]
    args: {module: ledger, change: {has: [delet, remov]}}
  - id: chg-not-water  # something new, though grown modules are there: a new module, not a change
    msg: I want to track how much water I drink every day
    expect: propose_module
    avoid: [change_module]
    modules: [hello, ledger, books]
    args: {name: {has: [water, hydrat, drink]}}
  - id: chg-not-log  # an entry for a grown module is an `add`, not a change to it
    msg: spent 240 on a haircut today
    expect: ask_module
    avoid: [change_module]
    modules: [hello, ledger, books]
    args: {module: ledger, action: add}
  - id: chg-not-question  # what it can do is under Modules: answer it
    msg: what can my expense module do?
    expect: none
    modules: [hello, ledger, books]

