name: hello
version: 0.1.0
purpose: Counts chat messages per day so the system has a first working module to deploy and query.
need: Hand-written example that proves the deploy, event and request paths work end to end.
subscribes: [sense.chat]
emits: [message.counted]
requests:                 # described, so Main knows what to send and what comes back
  stats:
    description: Messages counted on one day, and in all.
    params: {day: optional date}    # YYYY-MM-DD; today when left out
    returns: {day: date, count: number, total: number}
views:                    # how its data is seen, on its page and in the chat: a request that only reads, and the block
  today:
    title: Messages
    request: stats
    show: stats
    fields: [{key: count, label: Today}, {key: total, label: In all}]
hooks:
  interval_seconds: [3600]
permissions:
  network: false
  actuation: false
resources:
  memory_mb: 128
  cpus: 0.25
