# The core tables' Alembic tree. Services run it through mycelium_sdk.db.migrate() at start;
# from a terminal: DATABASE_URL=... alembic -c sdk/mycelium_sdk/db/migrations/core/alembic.ini upgrade head
[alembic]
script_location = %(here)s
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s
prepend_sys_path = sdk
# note: prepend_sys_path is relative to the working directory; run alembic from the repo root
