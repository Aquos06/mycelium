[project]
name = "mycelium-sdk"
version = "0.1.0"
description = "Shared runtime for mycelium modules and services: bus, manifest, module base class."
requires-python = ">=3.11"
dependencies = [
  "nats-py>=2.7",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mycelium_sdk"]
