# mycelium core stack
#   docker compose up -d --build              core: nats, postgres, tracer, supervisor, memory, gateway, main, builder
#   docker compose --profile telegram up -d   + telegram bridge (needs TELEGRAM_* in .env)
#   docker compose --profile local up -d      + ollama (local models; `make local` also pulls one)
#   docker compose --profile gpu up -d        + vllm (NVIDIA GPU box only)
#   python scripts/mctl.py build expenses specs/expenses.md --wait   grow a module (rpc.build.start)
#
# Modules are NOT in this file: the supervisor builds and starts them on request (rpc.sys.deploy).

name: ${STACK:-mycelium}

x-env: &core-env
  # the services' NATS login; modules get another (services/nats/nats.conf, the supervisor's MODULE_NATS_URL)
  NATS_URL: nats://core:${NATS_CORE_PASSWORD:?set NATS_CORE_PASSWORD in .env}@nats:4222
  DATABASE_URL: postgresql://mycelium:${POSTGRES_PASSWORD:-mycelium}@postgres:5432/mycelium
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]   # JetStream in /data, monitoring on 8222, the two logins
    environment:
      NATS_CORE_PASSWORD: ${NATS_CORE_PASSWORD:?set NATS_CORE_PASSWORD in .env}
      NATS_MODULE_PASSWORD: ${NATS_MODULE_PASSWORD:-module}
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MON_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
      - ./services/nats/nats.conf:/etc/nats/nats.conf:ro
    networks: [mesh, modules]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mycelium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mycelium}
      POSTGRES_DB: mycelium
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data   # schema comes from the owners' Alembic trees, run at service start
    networks: [mesh]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycelium -d mycelium"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tracer:
    build: { context: ., dockerfile: services/tracer/Dockerfile }
    image: ${REGISTRY:-mycelium}/tracer:${IMAGE_TAG:-dev}
    environment: *core-env
    networks: [mesh]
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  supervisor:
    build: { context: ., dockerfile: services/supervisor/Dockerfile }
    image: ${REGISTRY:-mycelium}/supervisor:${IMAGE_TAG:-dev}
    environment:
      <<: *core-env
      MODULES_DIR: /workspace/modules
      GROWN_DIR: /workspace/grown
      SDK_DIR: /workspace/sdk
      STACK: ${STACK:-mycelium}
      MODULE_NATS_URL: nats://module:${NATS_MODULE_PASSWORD:-module}@nats:4222   # what modules get: no rpc.*
      MODULE_NETWORK: ${STACK:-mycelium}-modules   # internal: bus only, no internet
      INTERNET_NETWORK: ${STACK:-mycelium}-mesh    # attached only for permissions.network
      RECONCILE_ON_START: ${RECONCILE_ON_START:-true}
      APPROVED_ACTUATORS: ${APPROVED_ACTUATORS:-}
      MODULE_TZ: ${MODULE_TZ:-${MEMORY_TZ:-Asia/Taipei}}   # every module's TZ: mod.today() is your day
      # coding agents (agent_images/agents.yaml) run in containers the supervisor starts, on the default bridge network:
      # their model by address, and the one key each needs; nothing else of this environment reaches them
      AGENT_ENDPOINT: ${AGENT_ENDPOINT:-${VLLM_ENDPOINT:-}}
      AGENT_MODEL: ${AGENT_MODEL:-${VLLM_MODEL:-}}
      AGENT_KEY: ${AGENT_KEY:-}
      AGENT_CONTEXT: ${AGENT_CONTEXT:-}               # opencode: the model's window (else asked of the server)
      AGENT_MAX_OUTPUT: ${AGENT_MAX_OUTPUT:-}         # opencode: tokens one answer may take (else a quarter)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}       # claude_code only
      CLAUDE_CODE_MODEL: ${CLAUDE_CODE_MODEL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # the ONLY container with Docker access
      - ./modules:/workspace/modules:ro
      - ${GROWN_DIR:-./grown}:/workspace/grown:ro   # grown modules: their own git repo, written by the builder
      - ./sdk:/workspace/sdk:ro
    networks: [mesh]
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  memory:
    build: { context: ., dockerfile: services/memory/Dockerfile }
    image: ${REGISTRY:-mycelium}/memory:${IMAGE_TAG:-dev}
    environment:
      <<: *core-env
      MEMORY_VAULT_DIR: /vault
      MEMORY_SCHEMA: memory
      MEMORY_TZ: ${MEMORY_TZ:-Asia/Taipei}
      MEMORY_CONSOLIDATE_AT: ${MEMORY_CONSOLIDATE_AT-03:30}    # nightly consolidation, local time; set empty to disable (`-`, not `:-`)
      MEMORY_EMBED: ${MEMORY_EMBED:-true}                       # vectors through the gateway's embed slot (EMBED_PROVIDER)
      MEMORY_EMBED_EVERY: ${MEMORY_EMBED_EVERY:-10}             # minutes between sweeps for rows without a vector
      MEMORY_DECIDE: ${MEMORY_DECIDE:-true}                     # the decide step for vague questions (DECIDE_PROVIDER)
      MEMORY_DECIDE_FLOOR: ${MEMORY_DECIDE_FLOOR:-}                # empty: the scorer's own floor from providers.yaml
      MEMORY_DECIDE_TIMEOUT: ${MEMORY_DECIDE_TIMEOUT:-30}         # seconds per scoring call; a reasoning model needs 60+
      MEMORY_DECIDE_ROUNDS: ${MEMORY_DECIDE_ROUNDS:-2}
    volumes:
      - vault:/vault       # the markdown vault: the curated memory, human-editable (docs/MEMORY.md)
    networks: [mesh]
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    image: ${REGISTRY:-mycelium}/gateway:${IMAGE_TAG:-dev}
    environment:
      NATS_URL: nats://core:${NATS_CORE_PASSWORD:?set NATS_CORE_PASSWORD in .env}@nats:4222
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GATEWAY_CONFIG: /srv/gateway/providers.yaml
      # ${VAR:-default} placeholders in providers.yaml: which provider is active, where a LAN vLLM lives
      PLANNER_PROVIDER: ${PLANNER_PROVIDER:-}
      CONSOLIDATE_PROVIDER: ${CONSOLIDATE_PROVIDER:-}
      VLLM_ENDPOINT: ${VLLM_ENDPOINT:-}
      VLLM_MODEL: ${VLLM_MODEL:-}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-}
      TEI_ENDPOINT: ${TEI_ENDPOINT:-}
      VLLM_EMBED_ENDPOINT: ${VLLM_EMBED_ENDPOINT:-}
      DECIDE_PROVIDER: ${DECIDE_PROVIDER:-}
      TEI_RERANK_ENDPOINT: ${TEI_RERANK_ENDPOINT:-}
      CODER_PROVIDER: ${CODER_PROVIDER:-}
      # model keys live here (and a coding agent's own key in the supervisor): one env var per kind (schemas/kinds.py)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    volumes:
      - ./services/gateway/providers.yaml:/srv/gateway/providers.yaml:ro   # which provider serves each slot
    networks: [mesh]
    depends_on:
      nats: { condition: service_healthy }
    restart: unless-stopped

  main:
    build: { context: ., dockerfile: services/main/Dockerfile }
    image: ${REGISTRY:-mycelium}/main:${IMAGE_TAG:-dev}
    environment:
      NATS_URL: nats://core:${NATS_CORE_PASSWORD:?set NATS_CORE_PASSWORD in .env}@nats:4222
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAIN_TZ: ${MAIN_TZ:-${MEMORY_TZ:-Asia/Taipei}}   # one TZ for memory and Main unless MAIN_TZ is set
      MAIN_LLM_TIMEOUT: ${MAIN_LLM_TIMEOUT:-90}        # raise for a cold local model (ollama first load)
      MAIN_CURRENCY: ${MAIN_CURRENCY:-TWD}              # money in what Main shows: an ISO code
    networks: [mesh]
    depends_on:
      nats: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: services/web/Dockerfile }
    image: ${REGISTRY:-mycelium}/web:${IMAGE_TAG:-dev}
    environment:
      NATS_URL: nats://core:${NATS_CORE_PASSWORD:?set NATS_CORE_PASSWORD in .env}@nats:4222
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_TOKEN: ${WEB_TOKEN:-}                        # the one login; empty leaves it open, so only on a trusted LAN
      WEB_USER_NAME: ${WEB_USER_NAME:-Hansen}
      WEB_CORS_ORIGINS: ${WEB_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}   # where the frontend is served from
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"             # Caddy / Tailscale in front of it for anything beyond this machine
    networks: [mesh]
    depends_on:
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        # baked in: where the BROWSER reaches the web gateway. `-` not `:-`, so an EMPTY value stays empty (= same origin, Caddy)
        NEXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE-http://localhost:8080}
    image: ${REGISTRY:-mycelium}/frontend:${IMAGE_TAG:-dev}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks: [mesh]
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama:
    profiles: [local]        # local planner / shadow (providers.yaml kind: ollama). `make local` pulls the model.
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}   # pin via OLLAMA_IMAGE in .env once chosen
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}   # default is small; the builder's coder needs 32k
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama-models:/root/.ollama
    networks: [mesh]
    restart: unless-stopped

  vllm:
    profiles: [gpu]          # the GPU box only (providers.yaml kind: vllm); needs the NVIDIA container toolkit
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}  # pin via VLLM_IMAGE in .env once chosen
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-14B-Instruct}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-32768}   # the builder's coder: a 12k prompt and up to 12k out
      - --enable-auto-tool-choice     # tools need these two flags; the parser matches the model family
      - --tool-call-parser
      - ${VLLM_TOOL_PARSER:-hermes}
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    networks: [mesh]
    restart: unless-stopped

  tei:
    profiles: [gpu]          # embeddings next to vllm (providers.yaml kind: tei). On a separate box use infra/embed/ instead.
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cuda-1.9}
    command:
      - --model-id
      - ${TEI_MODEL:-BAAI/bge-m3}
      - --max-client-batch-size
      - "256"
      - --auto-truncate
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf-cache:/data
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    networks: [mesh]
    restart: unless-stopped

  tei-rerank:
    profiles: [gpu]          # the decide step's scorer (providers.yaml kind: tei, slot decide); infra/embed/ on a separate box
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cuda-1.9}
    command:
      - --model-id
      - ${TEI_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - --max-client-batch-size
      - "256"
      - --auto-truncate
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf-cache:/data
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    networks: [mesh]
    restart: unless-stopped

  telegram:
    profiles: [telegram]
    build: { context: ., dockerfile: services/telegram/Dockerfile }
    image: ${REGISTRY:-mycelium}/telegram:${IMAGE_TAG:-dev}
    environment:
      <<: *core-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    networks: [mesh]
    depends_on:
      nats: { condition: service_healthy }
    restart: unless-stopped

  builder:
    build: { context: ., dockerfile: services/builder/Dockerfile }
    image: ${REGISTRY:-mycelium}/builder:${IMAGE_TAG:-dev}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # the grown modules and their git repo are yours
    environment:                                   # no DATABASE_URL, no model keys: models through the gateway, agents through the supervisor
      NATS_URL: nats://core:${NATS_CORE_PASSWORD:?set NATS_CORE_PASSWORD in .env}@nats:4222
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GROWN_DIR: /workspace/grown
      TEMPLATE_DIR: /workspace/template
      EXAMPLE_DIR: /workspace/example
      BUILDER_CODER: ${BUILDER_CODER:-mycelium}
      BUILDER_AGENTS: ${BUILDER_AGENTS:-opencode,claude_code,codex,aider}
    volumes:
      - ${GROWN_DIR:-./grown}:/workspace/grown     # writes .staging/<name>, then commits <name>; never runs it
      - ./template:/workspace/template:ro
      - ./modules/hello:/workspace/example:ro       # the module every coder is shown
    networks: [mesh]
    depends_on:
      nats: { condition: service_healthy }
    restart: unless-stopped

networks:
  mesh:
    name: ${STACK:-mycelium}-mesh
  modules:
    name: ${STACK:-mycelium}-modules
    internal: true

volumes:
  nats-data:
  pg-data:
  vault:
  ollama-models:
  hf-cache:
