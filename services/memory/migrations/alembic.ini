# Memory's Alembic tree: the index tables in the `memory` schema (or any schema: -x schema=memtest_x).
# The service runs it through mycelium_sdk.db.migrate() at start;
# from a terminal: DATABASE_URL=... alembic -c services/memory/migrations/alembic.ini upgrade head
[alembic]
script_location = %(here)s
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s
prepend_sys_path = services
# note: prepend_sys_path is relative to the working directory; run alembic from the repo root
