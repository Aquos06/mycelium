# The bus (docker-compose.yml mounts this at /etc/nats/nats.conf). Two logins:
#
#   core     the services: supervisor, builder, gateway, memory, main, web, tracer, telegram, and mctl.
#            Everything, as before. Its password ($NATS_CORE_PASSWORD) is never handed to a module.
#   module   the only login a module gets (the supervisor's MODULE_NATS_URL). Exactly what the SDK's Module
#            does: emit mod.<name>.<event>, observe on brain.observe, announce sys.module.started, answer
#            its own requests, and listen to events. No rpc.* request of any kind (rpc.sys.agent, rpc.build.start,
#            rpc.llm.complete, rpc.memory.*), no traces, no live model text, no JetStream.
#
# Both passwords come from the environment; the server refuses to start without them. The subjects below are
# mirrored in mycelium_sdk.subjects (MODULE_PUBLISHES, MODULE_LISTENS); tests/unit/test_nats_conf.py keeps the
# two the same.

port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"
}

authorization {
  users: [
    { user: core, password: $NATS_CORE_PASSWORD }
    {
      user: module
      password: $NATS_MODULE_PASSWORD
      permissions: {
        publish: { allow: ["mod.>", "brain.observe", "sys.module.started"] }
        subscribe: { allow: ["sense.>", "brain.>", "mod.>", "sys.>", "build.>", "out.>", "rpc.mod.>"] }
        allow_responses: true
      }
    }
  ]
}
