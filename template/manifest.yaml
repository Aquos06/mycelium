name: __NAME__
version: 0.1.0
purpose: Describe in one sentence what this module does for Hansen.
need: The observed need that caused this module to be built.
subscribes: []        # e.g. [sense.chat]
emits: []             # e.g. [item.logged]       -> mod.__NAME__.item.logged
requests: {}          # each described: Main reads these to call it      -> rpc.mod.__NAME__.<action>
#   summary:
#     description: Totals for a date range, all time when no dates are given.
#     params: {from: optional date, to: optional date}
#     returns: {total: number, count: number}
views: {}             # how its data is seen, on its page and in the chat: a request that only reads, the block
#   week: {title: This week, request: summary, args: {from: $week_start}, show: stats}
#   entries: {title: Entries, request: history, path: expenses, show: table, fields: [day, description, {key: amount, format: money}]}
hooks:
  interval_seconds: []
  daily: []           # times in the user's day, quoted: ["21:00"] -> @mod.at("21:00")
permissions:
  network: false
  actuation: false
resources:
  memory_mb: 256
  cpus: 0.5
